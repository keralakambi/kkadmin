<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKModels Admin</title>
    <link rel="stylesheet" href="../admin.css">
</head>
<body>
    <div class="admin-container">
        <nav class="admin-nav">
            <div class="nav-header">
                <h2>KKModels Admin</h2>
                <a href="../index.html" class="back-btn">← Back to Main</a>
            </div>
        </nav>
        
        <main class="admin-main">
            <div class="content-section active" id="models-section">
                <div class="section-header">
                    <h2>Models Management</h2>
                    <button class="add-btn" onclick="showAddModelForm()">+ Add Model</button>
                </div>
                <div id="modelsList" class="items-list"></div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="models-admin.js"></script>
</body>
</html>
